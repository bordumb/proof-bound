[workspace]
resolver = "2"
members = [
  "crates/proofbound-core",
  "crates/proofbound-manifest",
  "crates/proofbound-evidence",
  "crates/proofbound-cli",
  "crates/proofbound-verify",
  "crates/proofbound-adapter-lean",
  "crates/proofbound-adapter-aeneas",
  "crates/proofbound-adapter-kani",
  "crates/proofbound-adapter-node",
  "crates/proofbound-adapter-test",
  "crates/xtask",
  "demo/allowance/rust/kernel",
  "demo/artifact-certificate/rust/checker",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/bordumb/proof-bound/"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1.0.101"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.4", features = ["derive"] }
globset = "0.4.18"
flate2 = "1.1.9"
hex = "0.4.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.27.0"
tar = "0.4.46"
thiserror = "1.0.69"
toml = "0.8.23"
walkdir = "2.5.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
