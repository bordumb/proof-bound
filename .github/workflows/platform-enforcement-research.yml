name: Native platform enforcement research

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Research experiment to execute
        required: true
        type: choice
        options:
          - exp-0022
          - exp-0023
          - exp-0024
          - exp-0025
  push:
    paths:
      - .github/workflows/platform-enforcement-research.yml
      - python/proofbound/linux_enforcement_confirmation.py
      - python/tests/test_linux_enforcement_confirmation.py
      - docs/experiments/0024-linux-loader-closure/instrument/**
      - python/proofbound/linux_loader_enforcement_execute.py
      - python/proofbound/linux_loader_enforcement_research.py
      - python/proofbound/linux_loader_enforcement_attacks.py
      - python/proofbound/linux_loader_enforcement_confirmation.py
      - crates/proofbound-ir-prototype/src/linux_loader_enforcement.rs

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  windows-host-qualification:
    name: EXP-0023 · native Windows host qualification
    if: github.event_name == 'workflow_dispatch' && inputs.experiment == 'exp-0023'
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - name: Check out the exact research revision
        uses: actions/checkout@v5

      - name: Install the repository Python version
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Qualify the native Windows mechanism APIs
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/exp0023-results"
          python -m proofbound.windows_enforcement_probe `
            "$env:RUNNER_TEMP/exp0023-results/host-probe.json"
          python -m json.tool `
            "$env:RUNNER_TEMP/exp0023-results/host-probe.json"

      - name: Create suspended AppContainer process inside the registered job
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python -m proofbound.windows_process_smoke `
            "$env:RUNNER_TEMP/exp0023-results/process-smoke.json"
          $smokeExit = $LASTEXITCODE
          if (Test-Path "$env:RUNNER_TEMP/exp0023-results/process-smoke.json") {
            python -m json.tool `
              "$env:RUNNER_TEMP/exp0023-results/process-smoke.json"
          }
          Set-Content `
            "$env:RUNNER_TEMP/exp0023-results/process-smoke-exit.txt" `
            "$smokeExit"

      - name: Derive the preregistered Windows decision
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python -m proofbound.windows_enforcement_confirmation `
            "$env:RUNNER_TEMP/exp0023-results/host-probe.json" `
            "$env:RUNNER_TEMP/exp0023-results/process-smoke.json" `
            "$env:RUNNER_TEMP/exp0023-results/execution.json"
          python -m json.tool `
            "$env:RUNNER_TEMP/exp0023-results/execution.json"

      - name: Retain the exact host qualification
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: exp-0023-windows-host-qualification
          path: ${{ runner.temp }}/exp0023-results
          if-no-files-found: warn
          retention-days: 30

  windows-initialization-confirmation:
    name: EXP-0025 · native Windows enforcement confirmation
    if: github.event_name == 'workflow_dispatch' && inputs.experiment == 'exp-0025'
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: Check out the frozen candidate revision
        uses: actions/checkout@v5

      - name: Install exact Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Install exact Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Execute all frozen workloads and authority probes
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          $root = "$env:RUNNER_TEMP/exp0025-results"
          New-Item -ItemType Directory -Force $root
          python -m proofbound.windows_initialization_execute `
            "$env:GITHUB_WORKSPACE" `
            "$env:RUNNER_TEMP/exp0025-state" `
            "$root/capture.json"
          if ($LASTEXITCODE -ne 0) {
            throw "the frozen Windows confirmation did not produce a capture"
          }

      - name: Validate independently in Python and Rust
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          $root = "$env:RUNNER_TEMP/exp0025-results"
          python -m proofbound.windows_initialization_research `
            "$env:GITHUB_WORKSPACE" `
            "$root/capture.json" `
            "$root/python-report.json"
          if ($LASTEXITCODE -ne 0) { throw "Python validation failed" }
          cargo run --locked -p proofbound-ir-prototype -- `
            validate-windows-initialization `
            "$env:GITHUB_WORKSPACE" `
            "$root/capture.json" `
            "$root/rust-report.json"
          if ($LASTEXITCODE -ne 0) { throw "Rust validation failed" }
          $python = [IO.File]::ReadAllBytes("$root/python-report.json")
          $rust = [IO.File]::ReadAllBytes("$root/rust-report.json")
          if (-not [Linq.Enumerable]::SequenceEqual[byte]($python, $rust)) {
            throw "independent main reports differ"
          }

      - name: Reject all registered capture attacks independently
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          $root = "$env:RUNNER_TEMP/exp0025-results"
          python -m proofbound.windows_initialization_attacks `
            "$env:GITHUB_WORKSPACE" `
            "$root/capture.json" `
            "$root/attacks" `
            "$root/attacks/index.json" `
            "$root/python-attacks.json"
          if ($LASTEXITCODE -ne 0) { throw "Python attack validation failed" }
          cargo run --locked -p proofbound-ir-prototype -- `
            validate-windows-initialization-attacks `
            "$env:GITHUB_WORKSPACE" `
            "$root/attacks/index.json" `
            "$root/rust-attacks.json"
          if ($LASTEXITCODE -ne 0) { throw "Rust attack validation failed" }
          $python = [IO.File]::ReadAllBytes("$root/python-attacks.json")
          $rust = [IO.File]::ReadAllBytes("$root/rust-attacks.json")
          if (-not [Linq.Enumerable]::SequenceEqual[byte]($python, $rust)) {
            throw "independent attack reports differ"
          }

      - name: Derive and require the preregistered decision
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          $root = "$env:RUNNER_TEMP/exp0025-results"
          python -m proofbound.windows_initialization_confirmation `
            "$env:GITHUB_WORKSPACE" `
            "$root/capture.json" `
            "$root/rust-report.json" `
            "$root/python-report.json" `
            "$root/rust-attacks.json" `
            "$root/python-attacks.json" `
            "$root/execution.json"
          $decisionExit = $LASTEXITCODE
          if (Test-Path "$root/execution.json") {
            python -m json.tool "$root/execution.json"
          }
          if ($decisionExit -ne 0) {
            throw "EXP-0025 did not satisfy its preregistered pass rule"
          }

      - name: Retain the exact native Windows confirmation
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: exp-0025-windows-enforcement
          path: ${{ runner.temp }}/exp0025-results
          if-no-files-found: error
          retention-days: 30

  linux-confirmation:
    name: EXP-0022 · native Linux confirmation
    if: github.event_name == 'workflow_dispatch' && inputs.experiment == 'exp-0022'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out the exact research revision
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Install the repository Python version
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install pinned Python environment tools
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Bootstrap locked dependencies
        run: |
          cargo fetch --locked
          uv sync --frozen
          mkdir -p "$RUNNER_TEMP/exp0022-results"

      - name: Build the frozen Linux environment
        run: >-
          docker build
          --tag proofbound-exp0020:registered
          docs/experiments/0020-linux-enforcement-portability/instrument

      - name: Execute the frozen Linux corpus
        run: |
          uv run python -m proofbound.linux_enforcement_execute \
            "$PWD" \
            "$RUNNER_TEMP/exp0022-state" \
            "$RUNNER_TEMP/exp0022-results/capture.json"

      - name: Validate independently in Rust and Python
        run: |
          cargo run --locked --offline -p proofbound-ir-prototype -- \
            validate-linux-enforcement \
            "$PWD" \
            "$RUNNER_TEMP/exp0022-results/capture.json" \
            "$RUNNER_TEMP/exp0022-results/rust-report.json"
          uv run python -m proofbound.linux_enforcement_research \
            "$PWD" \
            "$RUNNER_TEMP/exp0022-results/capture.json" \
            "$RUNNER_TEMP/exp0022-results/python-report.json"
          cmp \
            "$RUNNER_TEMP/exp0022-results/rust-report.json" \
            "$RUNNER_TEMP/exp0022-results/python-report.json"

      - name: Derive the preregistered EXP-0022 decision
        run: |
          uv run python -m proofbound.linux_enforcement_confirmation \
            "$PWD" \
            "$RUNNER_TEMP/exp0022-results/capture.json" \
            "$RUNNER_TEMP/exp0022-results/rust-report.json" \
            "$RUNNER_TEMP/exp0022-results/python-report.json" \
            "$RUNNER_TEMP/exp0022-results/execution.json"
          python -m json.tool "$RUNNER_TEMP/exp0022-results/execution.json"

      - name: Require a supported passing host
        run: |
          python -c 'import json, os, pathlib; result = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "exp0022-results/execution.json").read_bytes()); raise SystemExit(0 if result["decision"] == "pass" else 1)'

      - name: Retain the exact platform evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: exp-0022-linux-enforcement
          path: ${{ runner.temp }}/exp0022-results
          if-no-files-found: warn
          retention-days: 30

  linux-loader-candidate:
    name: EXP-0024 · exact Linux loader closure
    if: github.event_name == 'push' || inputs.experiment == 'exp-0024'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out the exact research revision
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Install the repository Python version
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install pinned Python environment tools
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Bootstrap locked dependencies
        run: |
          cargo fetch --locked
          uv sync --frozen
          mkdir -p "$RUNNER_TEMP/exp0024-results"

      - name: Build the registered loader environment
        run: >-
          docker build
          --tag proofbound-exp0024:registered
          docs/experiments/0024-linux-loader-closure/instrument

      - name: Execute the frozen corpus with exact loader authority
        run: |
          uv run python -m proofbound.linux_loader_enforcement_execute \
            "$PWD" \
            "$RUNNER_TEMP/exp0024-state" \
            "$RUNNER_TEMP/exp0024-results/capture.json"

      - name: Validate independently in Rust and Python
        run: |
          cargo run --locked --offline -p proofbound-ir-prototype -- \
            validate-linux-loader-enforcement \
            "$PWD" \
            "$RUNNER_TEMP/exp0024-results/capture.json" \
            "$RUNNER_TEMP/exp0024-results/rust-report.json"
          uv run python -m proofbound.linux_loader_enforcement_research \
            "$PWD" \
            "$RUNNER_TEMP/exp0024-results/capture.json" \
            "$RUNNER_TEMP/exp0024-results/python-report.json"
          cmp \
            "$RUNNER_TEMP/exp0024-results/rust-report.json" \
            "$RUNNER_TEMP/exp0024-results/python-report.json"

      - name: Execute every registered validator attack
        run: |
          uv run python -m proofbound.linux_loader_enforcement_attacks \
            "$PWD" \
            "$RUNNER_TEMP/exp0024-results/capture.json" \
            "$PWD/target/debug/proofbound-ir-prototype" \
            "$RUNNER_TEMP/exp0024-results/attacks.json"

      - name: Derive and require the preregistered decision
        run: |
          uv run python -m proofbound.linux_loader_enforcement_confirmation \
            "$PWD" \
            "$RUNNER_TEMP/exp0024-results/capture.json" \
            "$RUNNER_TEMP/exp0024-results/rust-report.json" \
            "$RUNNER_TEMP/exp0024-results/python-report.json" \
            "$RUNNER_TEMP/exp0024-results/attacks.json" \
            "$RUNNER_TEMP/exp0024-results/execution.json"
          python -c 'import json, os, pathlib; result = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "exp0024-results/execution.json").read_bytes()); raise SystemExit(0 if result["decision"] == "pass" else 1)'

      - name: Retain the exact loader-closure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: exp-0024-linux-loader-capture
          path: ${{ runner.temp }}/exp0024-results
          if-no-files-found: warn
          retention-days: 30
