name: Reproduce Proofbound tool bundles

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact 40-character commit on main to reproduce
        required: true
        type: string
      verification_run_id:
        description: Successful Verify workflow run for the exact main revision
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: proofbound-tool-bundle-${{ inputs.revision }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PROOFBOUND_RELEASE_REVISION: ${{ inputs.revision }}
  PROOFBOUND_VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}

jobs:
  validate-revision:
    name: Validate exact mainline revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PROOFBOUND_RELEASE_REVISION }}
          fetch-depth: 0

      - name: Reject a symbolic, dirty, or non-mainline revision
        run: |
          [[ "$PROOFBOUND_RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$PROOFBOUND_RELEASE_REVISION"
          test "$GITHUB_WORKFLOW_SHA" = "$PROOFBOUND_RELEASE_REVISION"
          test "$(git rev-parse HEAD)" = "$PROOFBOUND_RELEASE_REVISION"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$PROOFBOUND_RELEASE_REVISION" origin/main
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Require the exact successful mainline verification run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PROOFBOUND_VERIFICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run_record="$RUNNER_TEMP/proofbound-verification-run.json"
          workflow_record="$RUNNER_TEMP/proofbound-verify-workflow.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PROOFBOUND_VERIFICATION_RUN_ID" > "$run_record"
          gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml" > "$workflow_record"
          python3 tools/release/validate_verification_run.py \
            --run-record "$run_record" \
            --workflow-record "$workflow_record" \
            --revision "$PROOFBOUND_RELEASE_REVISION"

      - name: Require closed release metadata
        run: |
          python3 tools/ci/version.py --check
          python3 tools/ci/changelog.py
          python3 tools/release/build_tool_bundle.py --check

  bundle:
    name: Reproduce tool bundle (${{ matrix.platform }})
    needs: validate-revision
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PROOFBOUND_RELEASE_REVISION }}
          fetch-depth: 0

      - name: Confirm the exact requested revision
        run: test "$(git rev-parse HEAD)" = "$PROOFBOUND_RELEASE_REVISION"

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@fef00d40025f7fd8f1ec759cbbb0f577ddfc3133 # 1.94.0

      - name: Populate the locked dependency cache
        run: cargo fetch --locked

      - name: Build, reproduce, and verify the complete bundle
        run: >-
          python3 tools/release/build_tool_bundle.py
          --output "dist/${{ matrix.platform }}"
          --expected-revision "$PROOFBOUND_RELEASE_REVISION"
          --verification-run-id "$PROOFBOUND_VERIFICATION_RUN_ID"

      - name: Verify retained checksums
        working-directory: dist/${{ matrix.platform }}
        run: sha256sum --check SHA256SUMS

      - name: Dogfood the fail-closed installer outside the workspace
        run: |
          archive="$(find "dist/${{ matrix.platform }}" -maxdepth 1 -type f -name '*.tar.gz' -print)"
          test -n "$archive"
          digest="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          install_root="$(mktemp -d)"
          python3 tools/release/install_tool_bundle.py \
            --archive "$archive" \
            --sha256 "$digest" \
            --destination "$install_root/bin"
          test "$(find "$install_root/bin" -type f | wc -l)" -eq 7
          "$install_root/bin/proofbound" --version
          "$install_root/bin/proofbound-verify" --version

      - name: Retain the exact tool bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proofbound-tools-${{ matrix.platform }}-${{ env.PROOFBOUND_RELEASE_REVISION }}
          path: dist/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish exact source identity
    needs: [validate-revision, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PROOFBOUND_RELEASE_REVISION }}
          fetch-depth: 0

      - name: Confirm the exact requested revision
        run: test "$(git rev-parse HEAD)" = "$PROOFBOUND_RELEASE_REVISION"

      - name: Download both candidates from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: proofbound-tools-*-${{ env.PROOFBOUND_RELEASE_REVISION }}
          path: dist/candidates
          merge-multiple: false

      - name: Prepare one closed public asset set
        run: >-
          python3 tools/release/prepare_tool_bundle_publication.py
          --candidates dist/candidates
          --output dist/publication
          --revision "$PROOFBOUND_RELEASE_REVISION"
          --verification-run-id "$PROOFBOUND_VERIFICATION_RUN_ID"
          --bundle-workflow-run-id "$GITHUB_RUN_ID"
          --producer-repository "$GITHUB_REPOSITORY"

      - name: Publish and verify the exact source identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="proofbound-tools-$PROOFBOUND_RELEASE_REVISION"
          test "$(gh api "/repos/$GITHUB_REPOSITORY" --jq .visibility)" = "public"
          state="creating"
          release_id=""
          tag_created="false"
          cleanup() {
            cleanup_tag="false"
            if { test "$state" = "draft" || \
              test "$state" = "mutable-published"; } \
              && test -n "$release_id"; then
              if gh api --method DELETE \
                "/repos/$GITHUB_REPOSITORY/releases/$release_id"; then
                cleanup_tag="true"
              else
                echo "draft cleanup needs operator inspection: release $release_id" >&2
              fi
            elif test "$state" = "tag"; then
              cleanup_tag="true"
            fi
            if test "$cleanup_tag" = "true" && test "$tag_created" = "true"; then
              ref_record="$RUNNER_TEMP/tool-bundle-cleanup-ref.json"
              if gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
                > "$ref_record" \
                && test "$(jq -r '.object.type + ":" + .object.sha' "$ref_record")" = \
                  "commit:$PROOFBOUND_RELEASE_REVISION"; then
                gh api --method DELETE \
                  "/repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true
              fi
            elif test "$state" = "release-creating" \
              || test "$state" = "publishing" \
              || test "$state" = "published"; then
              echo "release publication needs operator inspection: $tag" >&2
            fi
          }
          trap cleanup EXIT
          tag_record="$RUNNER_TEMP/tool-bundle-created-tag.json"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$tag" \
            -f "sha=$PROOFBOUND_RELEASE_REVISION" \
            > "$tag_record"
          test "$(jq -r '.ref + ":" + .object.type + ":" + .object.sha' \
            "$tag_record")" = \
            "refs/tags/$tag:commit:$PROOFBOUND_RELEASE_REVISION"
          tag_created="true"
          state="tag"
          created_release="$RUNNER_TEMP/tool-bundle-created-release.json"
          state="release-creating"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/releases" \
            -f "tag_name=$tag" \
            -f "target_commitish=$PROOFBOUND_RELEASE_REVISION" \
            -f "name=Proofbound tool bundle $PROOFBOUND_RELEASE_REVISION" \
            -f "body=Verify SHA256SUMS and TOOL-BUNDLE-PUBLICATION.json before use." \
            -F draft=true \
            -F prerelease=false \
            -f make_latest=false \
            > "$created_release"
          release_id="$(jq -r '.id' "$created_release")"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          state="draft"
          gh release upload "$tag" dist/publication/*
          release_record="$RUNNER_TEMP/tool-bundle-release-draft.json"
          gh api "/repos/$GITHUB_REPOSITORY/releases/$release_id" > "$release_record"
          test "$(jq -r .id "$release_record")" = "$release_id"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
            --jq '.object.type + ":" + .object.sha')" = \
            "commit:$PROOFBOUND_RELEASE_REVISION"
          python3 tools/release/validate_tool_bundle_release.py \
            --release-record "$release_record" \
            --staged dist/publication \
            --revision "$PROOFBOUND_RELEASE_REVISION" \
            --verification-run-id "$PROOFBOUND_VERIFICATION_RUN_ID" \
            --bundle-workflow-run-id "$GITHUB_RUN_ID" \
            --producer-repository "$GITHUB_REPOSITORY" \
            --expected-state draft
          published_record="$RUNNER_TEMP/tool-bundle-published-release.json"
          state="publishing"
          gh api --method PATCH \
            "/repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=false \
            > "$published_record"
          test "$(jq -r .id "$published_record")" = "$release_id"
          if test "$(jq -r '.draft | tostring' "$published_record")" = "false" \
            && test "$(jq -r '.immutable | tostring' "$published_record")" = "false"; then
            state="mutable-published"
            echo "GitHub published a mutable release; removing the exact owned release" >&2
            exit 1
          fi
          test "$(jq -r '.draft | tostring' "$published_record")" = "false"
          test "$(jq -r '.immutable | tostring' "$published_record")" = "true"
          state="published"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
            --jq '.object.type + ":" + .object.sha')" = \
            "commit:$PROOFBOUND_RELEASE_REVISION"
          release_record="$RUNNER_TEMP/tool-bundle-release-published.json"
          gh api "/repos/$GITHUB_REPOSITORY/releases/$release_id" > "$release_record"
          test "$(jq -r .id "$release_record")" = "$release_id"
          python3 tools/release/validate_tool_bundle_release.py \
            --release-record "$release_record" \
            --staged dist/publication \
            --revision "$PROOFBOUND_RELEASE_REVISION" \
            --verification-run-id "$PROOFBOUND_VERIFICATION_RUN_ID" \
            --bundle-workflow-run-id "$GITHUB_RUN_ID" \
            --producer-repository "$GITHUB_REPOSITORY" \
            --expected-state published
          anonymous="$RUNNER_TEMP/anonymous-tool-bundle"
          mkdir "$anonymous"
          public_root="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          curl --fail --location --silent --show-error --retry 5 \
            --retry-all-errors --retry-delay 2 \
            "$public_root/SHA256SUMS" --output "$anonymous/SHA256SUMS"
          cmp dist/publication/SHA256SUMS "$anonymous/SHA256SUMS"
          while read -r digest name; do
            test -n "$digest"
            curl --fail --location --silent --show-error --retry 5 \
              --retry-all-errors --retry-delay 2 \
              "$public_root/$name" --output "$anonymous/$name"
          done < "$anonymous/SHA256SUMS"
          (cd "$anonymous" && sha256sum --check SHA256SUMS)
          state="verified"
