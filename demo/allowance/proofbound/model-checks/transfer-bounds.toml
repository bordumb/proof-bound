schema = "proofbound-model-check-unit/1"
id = "transfer-bounds"
adapter = "kani"
package = "allowance-kernel"
harnesses = [
  "kani_harnesses::accepted_conserves_value",
  "kani_harnesses::accepted_never_overdraws",
  "kani_harnesses::accepted_respects_cap",
  "kani_harnesses::denial_returns_unchanged_state",
]
claims = [
  "DEMO-TRANSFER-001",
  "DEMO-TRANSFER-002",
  "DEMO-TRANSFER-003",
  "DEMO-TRANSFER-004",
]
solver = "cadical"
unwind = 1
assumptions = [
  "Each numeric seed is an unsigned 8-bit value.",
  "The destination is either the seed widened to u64 or u64::MAX minus that seed.",
]

[domain]
id = "allowance-u8-seeds-with-overflow-lane"
description = "All four u8 numeric seeds, both authorization values, and both low/high destination lanes; 2^34 finite requests, including destination-overflow cases."
cardinality = 17179869184
ordering_key = [0, 1, 2, 3, 4, 5]

[resource_budget]
time_seconds = 600
disk_bytes = 2147483648
memory_bytes = 4294967296
