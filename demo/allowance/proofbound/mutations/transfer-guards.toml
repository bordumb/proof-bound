schema = "proofbound-mutation-registry/1"
subject = "rust:allowance-kernel::decide_transfer"

[[mutations]]
id = "remove-authorization-guard"
guard = "authorized must be true"
mutant = "allowance_kernel::mutations::without_authorization_guard"
witness = "allowance_kernel::tests::authorization_mutation_is_detected"
affected_claims = ["DEMO-TRANSFER-005"]

[[mutations]]
id = "remove-positive-amount-guard"
guard = "amount must be nonzero"
mutant = "allowance_kernel::mutations::without_positive_amount_guard"
witness = "allowance_kernel::tests::positive_amount_mutation_is_detected"
affected_claims = ["DEMO-TRANSFER-005"]

[[mutations]]
id = "remove-cap-guard"
guard = "amount must not exceed cap"
mutant = "allowance_kernel::mutations::without_cap_guard"
witness = "allowance_kernel::tests::cap_mutation_is_detected"
affected_claims = ["DEMO-TRANSFER-003", "DEMO-TRANSFER-005"]

[[mutations]]
id = "remove-source-balance-guard"
guard = "checked subtraction must succeed"
mutant = "allowance_kernel::mutations::without_source_balance_guard"
witness = "allowance_kernel::tests::source_balance_mutation_is_detected"
affected_claims = [
  "DEMO-TRANSFER-001",
  "DEMO-TRANSFER-002",
  "DEMO-TRANSFER-005",
]

[[mutations]]
id = "remove-destination-overflow-guard"
guard = "checked addition must succeed"
mutant = "allowance_kernel::mutations::without_destination_overflow_guard"
witness = "allowance_kernel::tests::destination_overflow_mutation_is_detected"
affected_claims = ["DEMO-TRANSFER-001", "DEMO-TRANSFER-005"]
