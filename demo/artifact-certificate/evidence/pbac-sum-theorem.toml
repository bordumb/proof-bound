schema = "proofbound-evidence-unit/1"
id = "pbac-sum-theorem"
adapter = "lean"
kind = "theorem"
claims = ["PBAC-SUM-001"]
tier = 2
evaluation_mode = "native"
theorem = "ProofboundArtifactDemo.Claims.publishedArtifactSoundness"
assumptions = ["PBAC-NATIVE-SHA256-001"]
expected_inventory = [
  "ProofboundArtifactDemo.Claims.publishedArtifactSoundness",
  "ProofboundArtifactDemo.Claims.publishedCalibratedArtifactSoundness",
]
inputs = [
  "demo/artifact-certificate/lean/ProofboundArtifactDemo/Certificate.lean",
  "demo/artifact-certificate/lean/ProofboundArtifactDemo/Claims.lean",
  "lean/Proofbound/Artifact.lean",
  "lean/Proofbound/Sha256.lean",
]
outputs = []
environment_allowlist = ["LEAN_PATH", "PATH"]

[operation]
type = "lean-audit"
targets = ["ProofboundArtifactDemo.Claims"]
paths = [
  "demo/artifact-certificate/lean/ProofboundArtifactDemo/Certificate.lean",
  "demo/artifact-certificate/lean/ProofboundArtifactDemo/Claims.lean",
  "lean/Proofbound/Artifact.lean",
  "lean/Proofbound/Sha256.lean",
]

[resource_budget]
time_seconds = 60
disk_bytes = 268435456
memory_bytes = 1073741824
