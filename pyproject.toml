[project]
name = "proofbound"
version = "0.10.0"
description = "Proof-driven development orchestration and adapter helpers"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
proofbound-allowance-demo = "proofbound_demo.allowance:main"

[dependency-groups]
dev = ["jsonschema>=4.25,<5", "pytest>=8.4,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/proofbound", "demo/allowance/python/proofbound_demo"]

[tool.pytest.ini_options]
testpaths = ["python/tests", "demo/allowance/python/tests", "demo/artifact-certificate/python/tests"]
pythonpath = ["python", "demo/allowance/python", "demo/artifact-certificate/python"]
