schema = "proofbound-claim/1"
id = "PB-SELF-PUBLISH-012"
title = "Tool-bundle publication binds one public release to exact identities"
statement = "A Proofbound tool-bundle publication contains exactly the two supported platform candidates from one successful producing workflow run, binds their exact source and verification identities in a closed publication manifest, and rejects an existing tag, changed hosted identity, or anonymously unretrievable asset set."
subject = "workflow:.github/workflows/tool-bundle.yml#publish"
profile = "ledger"
tier = 0
evidence = ["test:tool-bundle-publication"]
assumptions = []
open_obligations = ["GitHub repository access controls, hosted release behavior, TLS, SHA-256 collision resistance, and the release runner remain trusted rather than proved."]
out_of_scope = ["Independent artifact signatures and behavior of the published executables."]
source_roots = [
  ".github/workflows/tool-bundle.yml",
  "schemas/tool-bundle-manifest.schema.json",
  "schemas/tool-bundle-publication-manifest.schema.json",
  "tools/release/build_tool_bundle.py",
  "tools/release/install_tool_bundle.py",
  "tools/release/prepare_tool_bundle_publication.py",
  "tools/release/validate_tool_bundle_release.py",
  "tools/release/validate_verification_run.py",
]
